name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.threads }} thread(s)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ matrix.version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.11'   # the minimum AirLang supports
          - '1'      # latest release
          - 'nightly'
        threads:
          - '1'
          - '4'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: air
          POSTGRES_PASSWORD: air
          POSTGRES_DB: air
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U air -d air"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
      AIRLANG_TEST_PG_URL: postgresql://air:air@localhost:5432/air
    steps:
      # AirLang depends on Air.jl and AirDB.jl through relative `[sources]`
      # paths, so all three checkouts must be siblings in the workspace.
      - name: Check out AirLang.jl
        uses: actions/checkout@v4
        with:
          path: AirLang.jl
      - name: Check out Air.jl
        uses: actions/checkout@v4
        with:
          repository: noahbenson/Air.jl
          path: Air.jl
      - name: Check out AirDB.jl
        uses: actions/checkout@v4
        with:
          repository: noahbenson/AirDB.jl
          path: AirDB.jl

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          show-versioninfo: true
      - uses: julia-actions/cache@v2

      - name: Resolve and precompile
        working-directory: AirLang.jl
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run the test suite
        working-directory: AirLang.jl
        run: julia --project=. --threads=${{ matrix.threads }} test/runtests.jl

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out AirLang.jl
        uses: actions/checkout@v4
        with:
          path: AirLang.jl
      - name: Check out Air.jl
        uses: actions/checkout@v4
        with:
          repository: noahbenson/Air.jl
          path: Air.jl
      - name: Check out AirDB.jl
        uses: actions/checkout@v4
        with:
          repository: noahbenson/AirDB.jl
          path: AirDB.jl
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: AirLang.jl
          file: AirLang.jl/Dockerfile
          build-contexts: |
            air=Air.jl
            airdb=AirDB.jl
          push: false
          load: true
          tags: airlang:ci
      - name: Smoke-test the image
        run: |
          docker run --rm airlang:ci -e '(+ 1 2)' | grep -qx '3'
          docker run --rm airlang:ci -e '(thread (f (1 2 3)))' | grep -qx '((f 1) (f 2) (f 3))'
