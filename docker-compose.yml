# air and a PostgreSQL sidecar.
#
# AirLang depends on the sibling Air.jl and AirDB.jl checkouts, so they are
# passed to the build as the named contexts `air` and `airdb`:
#
#     docker compose up --build
#     docker compose run --rm air          # just the air container
#
# The host's ./lib is mounted at /air/lib (the first AIR_LIBPATH entry), so a
# library dropped in ./lib/<name>/init.air is available inside the container.
# The REPL is interactive: `stdin_open`/`tty` keep it attached.
#
# Open the database from air with e.g.
#
#     (open-airdb .db dbname="air" user="air" password="air" host="postgres" create=true)
#
# `create=true` creates AirDB's schema inside the (already existing) `air`
# database provided by the sidecar; omit it to reopen an existing schema.

services:
  air:
    build:
      context: .
      additional_contexts:
        air: ../Air.jl
        airdb: ../AirDB.jl
    image: airlang:latest
    init: true
    environment:
      AIR_LIBPATH: /air/lib
      PGHOST: postgres
      PGUSER: air
      PGPASSWORD: air
      PGDATABASE: air
    volumes:
      - ./lib:/air/lib:ro
      - ./:/work
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /work
    stdin_open: true
    tty: true

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: air
      POSTGRES_PASSWORD: air
      POSTGRES_DB: air
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U air -d air"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
