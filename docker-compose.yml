# air and a PostgreSQL sidecar.
#
#     docker compose up -d --build   # start air (SSH on :2222) and PostgreSQL
#     docker compose logs -f air     # follow the air log
#     docker compose down            # stop both; the pgdata volume survives
#
# The air container runs `air --serve startup.air` from the repository root
# (mounted at /work). `startup.air` opens the PostgreSQL sidecar as the
# namespace `.db`, creates an example user with an SSH key, starts an SSH
# server on port 2222, and prints a login hint; `--serve` then keeps the
# process up. Edit `startup.air` to change the user or key, then rerun
# `docker compose restart air`.
#
# The host's ./lib is mounted at /air/lib, the first AIR_LIBPATH entry, so a
# library in ./lib/<name>/init.air is available inside the container.
#
# One-off commands use the same image and mounts:
#
#     docker compose run --rm air -e '(+ 1 2)'
#     ./bin/air-docker               # an interactive REPL
#
# Open the database by hand with
#
#     (open-airdb .db dbname="air" user="air" password="air" host="postgres" create=true)

services:
  air:
    build:
      context: .
      additional_contexts:
        air: ../Air.jl
        airdb: ../AirDB.jl
    image: airlang:latest
    init: true
    # `air --serve` ends at once on SIGINT; Julia's SIGTERM path prints a
    # shutdown backtrace, so `docker stop`/`down` use SIGINT.
    stop_signal: SIGINT
    command: ["--serve", "startup.air"]
    environment:
      AIR_LIBPATH: /air/lib
      PGHOST: postgres
      PGUSER: air
      PGPASSWORD: air
      PGDATABASE: air
    ports:
      - "2222:2222"
    volumes:
      - ./lib:/air/lib:ro
      - ./:/work
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /work

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: air
      POSTGRES_PASSWORD: air
      POSTGRES_DB: air
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U air -d air"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
